services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./server:/usr/src/app/server
      - ./shared:/usr/src/app/shared
      - /usr/src/app/server/node_modules
      - /usr/src/app/shared/node_modules
      - uploads_data:/usr/src/app/server/uploads
      - public_data:/usr/src/app/server/public
    env_file:
      - ./server/.env
    environment:
      # DigitalOcean Spaces configuration
      - DO_SPACES_ENDPOINT=sgp1.digitaloceanspaces.com
      - DO_SPACES_KEY=DO80136R3RPP3ZZZHKMJ
      - DO_SPACES_SECRET=FkiBADek+cYRFBbflZ2XVbWCN7paHXv80kLZ9gfzklM
      - DO_SPACES_BUCKET=tik-nok-uploads
      - DO_CDN_ENABLED=true
      - DO_CDN_ENDPOINT=tik-nok-uploads.sgp1.cdn.digitaloceanspaces.com
      - USE_SPACES_STORAGE=true
    depends_on:
      - redis
    networks:
      - app_network

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client:/usr/src/app/client
      - ./shared:/usr/src/app/shared
      - /usr/src/app/client/node_modules
      - /usr/src/app/shared/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
      - HOST=0.0.0.0
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:
  uploads_data:
  public_data: 